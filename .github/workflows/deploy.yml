
name: Deploy Daily Philosophy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate lessons against their sources
        run: node tools/validate.mjs

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          mkdir -p publish/tools
          cp index.html publish/index.html
          cp -r content publish/content
          cp tools/validate.mjs publish/tools/validate.mjs

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./publish/
          server-dir: ./
          dry-run: false
