<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes to Myself</title>
  <meta name="description" content="One idea. Two minutes. A little wiser. Short philosophy lessons grounded in primary texts, with a journal you write yourself.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap">
  <style>
    :root {
      --paper: #f7f3ea; --card: #fffdf8; --ink: #23201b; --muted: #6b6459;
      --rule: #ddd5c5; --accent: #7a2e2e; --within: #2a6b5e; --beyond: #4d5876;
      --within-bg: #e3f0ec; --beyond-bg: #e6e9f1; --focus: #1d5fbf;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #191715; --card: #211e1b; --ink: #ece6da; --muted: #a59c8d;
        --rule: #3a352f; --accent: #e0a193; --within: #7fc9b8; --beyond: #a9b4d6;
        --within-bg: #1d302c; --beyond-bg: #232838; --focus: #8ab4ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font: 400 1.0625rem/1.65 Roboto, system-ui, sans-serif;
    }
    main, header.site, footer.site { max-width: 42rem; margin: 0 auto; padding: 0 1rem; }
    header.site { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-top: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--rule); }
    .brand { font: 700 1.25rem "Playfair Display", Georgia, serif; }
    .tagline { color: var(--muted); font-size: .875rem; }
    a { color: var(--accent); }
    h1, h2 { font-family: "Playfair Display", Georgia, serif; line-height: 1.2; }
    h1 { font-size: clamp(2rem, 7vw, 2.75rem); margin: .25rem 0 .5rem; }
    h2 { font-size: 1.375rem; margin: 0 0 .75rem; }
    .days { display: flex; flex-wrap: wrap; gap: .4rem; list-style: none; padding: 0; margin: 1.25rem 0 0; }
    .days a, .days span {
      display: flex; align-items: center; justify-content: center; gap: .2rem;
      min-width: 2.75rem; min-height: 2.75rem; padding: 0 .6rem; border-radius: 2rem;
      border: 1px solid var(--rule); font-weight: 500; font-size: .9375rem; text-decoration: none; color: var(--ink);
    }
    .days span { color: var(--muted); border-style: dashed; }
    .days a.done { background: var(--within-bg); border-color: var(--within); }
    .days a[aria-current] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .eyebrow { color: var(--accent); font-size: .8125rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; margin-top: 1.5rem; }
    .objective { color: var(--muted); margin: 0 0 1.5rem; }
    section.step { background: var(--card); border: 1px solid var(--rule); border-radius: .75rem; padding: 1.25rem; margin: 1.25rem 0; }
    .step-num { color: var(--muted); font-size: .8125rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .25rem; }
    .transcript p { margin: 0 0 1rem; }
    button {
      font: inherit; font-weight: 500; cursor: pointer; border-radius: .5rem;
      border: 1px solid var(--ink); background: transparent; color: var(--ink);
      padding: .55rem .9rem; min-height: 2.75rem;
    }
    button.primary { background: var(--ink); color: var(--paper); }
    button:disabled { cursor: default; opacity: .55; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .listen { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-bottom: 1.25rem; }
    .listen small, .hint, .note { color: var(--muted); font-size: .875rem; }
    audio { width: 100%; }
    details { border-top: 1px solid var(--rule); margin-top: 1rem; padding-top: .75rem; }
    summary { cursor: pointer; font-weight: 500; }
    blockquote { margin: .75rem 0; padding-left: 1rem; border-left: 3px solid var(--rule); font-family: Georgia, serif; }
    .scenario { font-family: Georgia, serif; font-size: 1.125rem; margin: 0 0 .75rem; }
    .item { border-top: 1px solid var(--rule); padding: .9rem 0; }
    .item p { margin: 0 0 .6rem; }
    .choices { display: flex; flex-wrap: wrap; gap: .5rem; }
    .choices button { flex: 1 1 10rem; }
    .choices button[data-slot="0"] { border-color: var(--within); color: var(--within); }
    .choices button[data-slot="1"] { border-color: var(--beyond); color: var(--beyond); }
    .choices button[aria-pressed="true"][data-slot="0"] { background: var(--within-bg); opacity: 1; }
    .choices button[aria-pressed="true"][data-slot="1"] { background: var(--beyond-bg); opacity: 1; }
    .choices.stack { flex-direction: column; }
    .choices.stack button { flex: none; text-align: left; font-weight: 400; }
    .choices.stack button[aria-pressed="true"] { background: var(--beyond-bg); opacity: 1; font-weight: 500; }
    .scene:first-child { border-top: 0; padding-top: 0; }
    .feedback { margin: .6rem 0 0 !important; font-size: .9375rem; }
    .feedback strong { display: block; }
    .summary, .block { border-top: 1px solid var(--rule); padding-top: .9rem; margin-top: .9rem; }
    .summary ul { margin: .25rem 0 .75rem; padding-left: 1.25rem; }
    .answer { margin: .75rem 0 0; }
    dl { margin: .5rem 0 0; } dt { font-weight: 500; margin-top: .5rem; } dd { margin: 0; white-space: pre-wrap; }
    label { display: block; font-weight: 500; margin-top: 1rem; }
    label.slot-0 { color: var(--within); } label.slot-1 { color: var(--beyond); }
    textarea {
      width: 100%; min-height: 5.5rem; margin-top: .35rem; padding: .65rem; resize: vertical;
      font: inherit; color: var(--ink); background: var(--paper);
      border: 1px solid var(--rule); border-radius: .5rem;
    }
    .two-lists { display: grid; gap: 0 1rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-top: 1rem; }
    .practice { font-family: Georgia, serif; font-size: 1.1875rem; margin: 0 0 1rem; }
    section.complete { border-style: dashed; color: var(--muted); }
    section.complete.is-done { border: 2px solid var(--within); background: var(--within-bg); color: var(--ink); }
    section.complete p { margin: 0 0 .5rem; }
    a.button { display: inline-flex; align-items: center; min-height: 2.75rem; padding: .55rem .9rem; border-radius: .5rem; background: var(--ink); color: var(--paper); font-weight: 500; text-decoration: none; }
    .days a.waiting { border-style: dashed; color: var(--muted); }
    .banner { background: var(--beyond-bg); border: 1px solid var(--rule); border-radius: .5rem; padding: .75rem 1rem; margin-top: 1.25rem; font-size: .9375rem; }
    .review li { margin-bottom: .6rem; }
    .review code { font-size: .8125rem; }
    .bad { color: var(--accent); font-weight: 500; }
    footer.site { color: var(--muted); font-size: .875rem; padding-top: 1rem; padding-bottom: 3rem; }
  </style>
</head>
<body>
  <header class="site">
    <span class="brand">Notes to Myself</span>
    <span class="tagline">One idea. Two minutes. A little wiser.</span>
  </header>
  <main id="app" aria-live="polite"><p class="note" style="margin-top:2rem">Loading today's lesson…</p></main>
  <footer class="site" id="foot"></footer>

  <script type="module">
    const WEEK_ID = "w01-stoic";
    const params = new URLSearchParams(location.search);
    const PREVIEW = params.has("preview");
    const STORE_KEY = "notes-to-myself.v1";
    const DAY_MS = 86400000;

    // ---- small helpers ----
    const el = (tag, attrs = {}, ...kids) => {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") node.className = v;
        else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
        else if (v !== null && v !== undefined) node.setAttribute(k, v);
      }
      for (const kid of kids.flat(Infinity)) if (kid != null) node.append(kid);
      return node;
    };
    const paras = (text) => text.split(/\n\n+/).map((p) => el("p", {}, p));
    const loadStore = () => {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
    };
    const saveStore = (s) => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); return true; } catch { return false; }
    };
    const getJSON = async (url) => {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error(`${url}: ${res.status}`);
      return res.json();
    };
    const midnight = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const dayHref = (day) => `?day=${day}${PREVIEW ? "&preview=1" : ""}`;
    const stepHead = (n, name) => el("div", { class: "step-num" }, `${n} · ${name}`);

    // ---- yesterday: retrieval question and practice follow-up ----
    function yesterdayStep(n, lesson, ctx) {
      const { week, lessons, store } = ctx;
      const wrap = el("section", { class: "step" }, stepHead(n, "Yesterday"));
      const r = lesson.retrieval;
      if (r) {
        const from = lessons[r.of];
        const answer = el("div", { class: "answer", hidden: "", role: "status" },
          el("p", {}, el("strong", {}, r.answer)),
          from ? el("blockquote", {}, r.support_span) : null,
          from ? el("p", { class: "note" }, `${from.source.author}, ${from.source.work}, §${from.source.section}`) : null);
        const show = el("button", { type: "button", onclick: () => { answer.hidden = false; show.disabled = true; } }, "Show the answer");
        wrap.append(el("p", { class: "scenario" }, r.question),
          el("p", { class: "note" }, "Answer in your head first. Trying to remember is what makes it stick."),
          show, answer);
      }
      const f = lesson.practice_followup;
      if (f) {
        const planned = week.lessons.find((l) => l.id === f.of);
        const reply = el("p", { class: "feedback", hidden: "", role: "status" });
        const pick = (key) => {
          reply.textContent = f.responses[key];
          reply.hidden = false;
          store.followups = { ...store.followups, [lesson.id]: key };
          saveStore(store);
        };
        const block = el("div", { class: "block" },
          el("p", { class: "note" }, "Yesterday's practice"),
          el("p", { class: "practice" }, planned.practice),
          el("p", {}, f.question),
          el("div", { class: "choices" },
            el("button", { type: "button", onclick: () => pick("yes") }, "Yes"),
            el("button", { type: "button", onclick: () => pick("no") }, "Not yet")),
          reply);
        const page = store.pages?.[f.of]?.values;
        const fields = lessons[f.of]?.reflection.fields;
        if (page && fields) {
          block.append(el("details", {},
            el("summary", {}, "Your page from yesterday"),
            el("dl", {}, fields.map((fd) => [el("dt", {}, fd.label), el("dd", {}, page[fd.id] || "(left blank)")]))));
        }
        wrap.append(block);
      }
      return wrap;
    }

    // ---- listen and read ----
    function listenStep(n, lesson) {
      const spoken = lesson.script?.text ?? lesson.intro;
      const controls = el("div", { class: "listen" });
      if (lesson.audio?.file) {
        controls.append(el("audio", { controls: "", preload: "none", src: lesson.audio.file }));
      } else if ("speechSynthesis" in window) {
        let speaking = false;
        const btn = el("button", { class: "primary", type: "button" }, "▶ Listen");
        const stop = () => { speechSynthesis.cancel(); speaking = false; btn.textContent = "▶ Listen"; };
        btn.addEventListener("click", () => {
          if (speaking) return stop();
          const u = new SpeechSynthesisUtterance(spoken);
          u.rate = 0.95;
          u.onend = u.onerror = () => { speaking = false; btn.textContent = "▶ Listen"; };
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
          speaking = true;
          btn.textContent = "■ Stop";
        });
        window.addEventListener("pagehide", stop);
        controls.append(btn, el("small", {}, "Read aloud by your browser's voice. A recorded narration is on the way."));
      }
      const s = lesson.source;
      const source = el("details", {},
        el("summary", {}, `Read the source: ${s.author}, ${s.work}, §${s.section}`),
        el("blockquote", {}, paras(s.passage)),
        el("p", { class: "note" }, `Translated by ${s.translator}. ${s.rights}. `,
          el("a", { href: s.source_url, rel: "noopener" }, "Project Gutenberg edition")));
      return el("section", { class: "step" },
        stepHead(n, lesson.type === "scenario" ? "The passage" : "Listen"),
        controls,
        el("div", { class: "transcript" }, paras(spoken)),
        source);
    }

    // ---- branching scenario ----
    function scenarioStep(n, lesson, ctx) {
      const { store } = ctx;
      const sc = lesson.scenario;
      const picked = [];
      const trail = el("div", {});
      const wrap = el("section", { class: "step" }, stepHead(n, "Scenario"), trail);
      const shuffled = (list) => {
        const copy = [...list];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      };
      function show(id) {
        const node = sc.nodes[id];
        if (node.ending) return finish(node);
        const feedback = el("p", { class: "feedback", hidden: "", role: "status" });
        const onward = el("div", { class: "actions", hidden: "" });
        const buttons = shuffled(node.choices).map((choice) => {
          const b = el("button", { type: "button", "aria-pressed": "false", onclick: () => {
            buttons.forEach((x) => { x.disabled = true; });
            b.setAttribute("aria-pressed", "true");
            if (choice.misconception) picked.push(choice.misconception);
            feedback.replaceChildren(el("strong", {}, choice.misconception ? "A common misreading." : "That is the move."), choice.feedback);
            feedback.hidden = false;
            const go = el("button", { class: "primary", type: "button", onclick: () => { go.disabled = true; show(choice.next); } }, "Continue");
            onward.replaceChildren(go);
            onward.hidden = false;
            go.focus();
          } }, choice.text);
          return b;
        });
        const block = el("div", { class: "item scene" },
          el("p", { class: "scenario" }, node.text),
          el("p", {}, node.prompt),
          el("div", { class: "choices stack" }, buttons),
          feedback, onward);
        trail.append(block);
        if (trail.children.length > 1) block.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      function finish(node) {
        const tags = [...new Set(picked)];
        store.checks = { ...store.checks, [lesson.id]: { at: new Date().toISOString(), misconceptions: tags } };
        saveStore(store);
        const end = el("div", { class: "summary" },
          el("p", { class: "scenario" }, node.text),
          tags.length === 0
            ? el("p", {}, "You kept both goals at every turn.")
            : [el("p", {}, "Misreadings you tried along the way. There is no score:"),
               el("ul", {}, tags.map((t) => el("li", {}, sc.misconception_notes?.[t] ?? t)))],
          el("button", { type: "button", onclick: () => { picked.length = 0; trail.replaceChildren(); show(sc.start); wrap.scrollIntoView({ behavior: "smooth" }); } }, "Play it again"));
        trail.append(end);
        end.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      show(sc.start);
      return wrap;
    }

    // ---- sort ----
    function sortStep(n, lesson, ctx) {
      const { store } = ctx;
      const check = lesson.check;
      const total = check.items.length;
      const answers = {};
      const wrap = el("section", { class: "step" },
        stepHead(n, "Sort"),
        el("p", { class: "scenario" }, check.scenario),
        el("p", {}, check.question));
      const summary = el("div", { class: "summary", hidden: "" });
      const items = check.items.map((item, i) => {
        const feedback = el("p", { class: "feedback", hidden: "", role: "status" });
        const buttons = Object.entries(check.lists).map(([key, label], slot) =>
          el("button", { type: "button", "data-list": key, "data-slot": slot, "aria-pressed": "false", onclick: () => choose(key) }, label));
        function choose(key) {
          answers[i] = key;
          buttons.forEach((b) => { b.setAttribute("aria-pressed", String(b.dataset.list === key)); b.disabled = true; });
          const right = key === item.list;
          feedback.replaceChildren(el("strong", {}, right ? "Yes." : "Look again."), item.feedback);
          feedback.hidden = false;
          if (Object.keys(answers).length === total) finish();
        }
        const reset = () => {
          buttons.forEach((b) => { b.setAttribute("aria-pressed", "false"); b.disabled = false; });
          feedback.hidden = true;
        };
        const node = el("div", { class: "item" }, el("p", {}, item.text), el("div", { class: "choices" }, buttons), feedback);
        return { node, reset };
      });
      function finish() {
        const missed = check.items.filter((item, i) => answers[i] !== item.list);
        const tags = [...new Set(missed.map((m) => m.misconception))];
        store.checks = { ...store.checks, [lesson.id]: { at: new Date().toISOString(), misconceptions: tags } };
        saveStore(store);
        summary.replaceChildren(
          missed.length === 0
            ? el("p", {}, check.all_correct ?? `All ${total} match Epictetus's lists.`)
            : el("div", {},
                el("p", {}, `${total - missed.length} of ${total} match. Worth another look:`),
                el("ul", {}, tags.map((t) => el("li", {}, check.misconception_notes?.[t] ?? t)))),
          el("button", { type: "button", onclick: again }, "Sort again"));
        summary.hidden = false;
      }
      function again() {
        for (const k of Object.keys(answers)) delete answers[k];
        items.forEach((it) => it.reset());
        summary.hidden = true;
      }
      wrap.append(...items.map((it) => it.node), summary);
      return wrap;
    }

    // ---- the learner's own page ----
    function pageText(lesson, week, values) {
      const s = lesson.source;
      const lines = [
        "NOTES TO MYSELF", "",
        `${week.title}`, `Day ${lesson.day}: ${lesson.title}`,
        `${s.author}, ${s.work}, section ${s.section} (tr. ${s.translator})`,
        new Date().toLocaleDateString(undefined, { dateStyle: "long" }), "",
      ];
      for (const f of lesson.reflection.fields) lines.push(f.label.toUpperCase(), values[f.id] || "(left blank)", "");
      lines.push("PRACTICE", lesson.practice.text, "");
      return lines.join("\r\n");
    }
    function journalStep(n, lesson, ctx) {
      const { week, store } = ctx;
      const saved = store.pages?.[lesson.id]?.values ?? {};
      const inputs = {};
      const field = (f, cls) => {
        const ta = el("textarea", { id: `f-${f.id}`, "aria-describedby": `h-${f.id}` });
        ta.value = saved[f.id] ?? "";
        inputs[f.id] = ta;
        return el("div", {},
          el("label", { for: `f-${f.id}`, class: cls }, f.label), ta,
          el("div", { class: "hint", id: `h-${f.id}` }, f.hint ?? ""));
      };
      // The last two fields are the day's pair (two lists, event and story); any others come first.
      const fields = lesson.reflection.fields;
      const lead = fields.slice(0, -2);
      const pair = fields.slice(-2);
      const status = el("span", { class: "note", role: "status" },
        store.pages?.[lesson.id] ? "Your earlier page is loaded." : "");
      const values = () => Object.fromEntries(Object.entries(inputs).map(([k, ta]) => [k, ta.value.trim()]));
      const save = () => {
        store.pages = { ...store.pages, [lesson.id]: { savedAt: new Date().toISOString(), values: values() } };
        status.textContent = saveStore(store)
          ? "Saved in this browser. Download a copy to keep it."
          : "This browser won't store pages. Download a copy instead.";
        ctx.onSaved?.();
      };
      const download = () => {
        const blob = new Blob([pageText(lesson, week, values())], { type: "text/plain;charset=utf-8" });
        const a = el("a", { href: URL.createObjectURL(blob), download: `notes-to-myself-day-${lesson.day}.txt` });
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };
      return el("section", { class: "step" },
        stepHead(n, "Your page"),
        el("h2", {}, lesson.reflection.prompt),
        lead.map((f) => field(f)),
        el("div", { class: "two-lists" }, pair.map((f, slot) => field(f, `slot-${slot}`))),
        el("div", { class: "actions" },
          el("button", { class: "primary", type: "button", onclick: save }, "Save my page"),
          el("button", { type: "button", onclick: download }, "Download"),
          status),
        el("p", { class: "note" }, "Your page stays on this device. Nothing you write is sent anywhere."));
    }

    // ---- practice ----
    function practiceStep(n, lesson) {
      return el("section", { class: "step" },
        stepHead(n, "Carry it with you"),
        el("p", { class: "practice" }, lesson.practice.text));
    }

    // ---- day complete ----
    // A day is complete once its page is saved. The next day opens the following
    // calendar day, so the practice has time to happen, but the learner can skip the wait.
    function completeStep(lesson, ctx) {
      const { week, store } = ctx;
      const card = el("section", { class: "step complete", role: "status" });
      const next = week.lessons.find((l) => l.day === lesson.day + 1);
      const openNow = () => {
        store.early = { ...store.early, [next.id]: true };
        saveStore(store);
        location.href = dayHref(next.day);
      };
      const draw = () => {
        const done = Boolean(store.pages?.[lesson.id]);
        card.classList.toggle("is-done", done);
        if (!done) {
          card.replaceChildren(
            el("div", { class: "step-num" }, `Day ${lesson.day} of ${week.lessons.length}`),
            el("p", {}, `Save your page above to complete Day ${lesson.day}.`));
          return;
        }
        const kids = [el("h2", {}, `Day ${lesson.day} complete ✓`)];
        if (!next) {
          kids.push(el("p", {}, "That is the whole week. Your seven pages are your own small handbook."));
        } else if (!ctx.visible(next)) {
          kids.push(el("p", {}, `Day ${next.day}, ${next.title}, is still being written. Until then, keep today's practice going.`));
        } else if (ctx.state(next) === "waiting") {
          kids.push(
            el("p", {}, `Day ${next.day}, ${next.title}, opens tomorrow. Give yourself the day to try the practice: tomorrow's lesson starts by asking how it went.`),
            el("div", { class: "actions" },
              el("button", { type: "button", onclick: openNow }, `Open Day ${next.day} now`),
              el("span", { class: "note" }, "Skips the wait.")));
        } else {
          kids.push(el("div", { class: "actions" },
            el("a", { class: "button", href: dayHref(next.day) }, `Go to Day ${next.day}: ${next.title}`)));
        }
        card.replaceChildren(...kids);
      };
      draw();
      return { card, draw };
    }

    // ---- reviewer view (?preview) ----
    async function reviewPanel(lesson, ctx) {
      const panel = el("section", { class: "step review" }, el("div", { class: "step-num" }, "Reviewer view"));
      try {
        const { validateLesson, countWords } = await import("./tools/validate.mjs");
        const { errors, warnings } = validateLesson(lesson, ctx.week, ctx.lessons);
        panel.append(
          el("p", {}, `Status: ${lesson.review.status}. ${lesson.script ? "Script" : "Intro"}: ${countWords(lesson.script?.text ?? lesson.intro)} words. `,
            errors.length ? el("span", { class: "bad" }, `${errors.length} error(s).`) : "No validator errors."),
          el("ul", {}, errors.map((e) => el("li", { class: "bad" }, e)), warnings.map((w) => el("li", {}, `Warning: ${w}`))));
      } catch (err) {
        panel.append(el("p", { class: "bad" }, `Validator could not load: ${err.message}`));
      }
      panel.append(
        el("h2", {}, "Claims and their supporting words"),
        el("ul", {}, lesson.claims.map((c) => el("li", {}, c.claim, el("blockquote", {}, c.support_span), c.note ? el("div", { class: "note" }, c.note) : null))),
        el("h2", {}, "Claims from outside the passage"),
        lesson.outside_source_claims.length
          ? el("ul", {}, lesson.outside_source_claims.map((c) => el("li", {}, c.claim, " ", el("code", {}, c.status), el("div", { class: "note" }, c.note))))
          : el("p", { class: "note" }, "None."));
      return panel;
    }

    // ---- boot ----
    const app = document.getElementById("app");
    try {
      const week = await getJSON(`content/weeks/${WEEK_ID}.json`);
      const lessons = {};
      await Promise.all(week.lessons.filter((l) => l.available).map(async (l) => {
        lessons[l.id] = await getJSON(`content/lessons/${l.id}.json`);
      }));
      const store = loadStore();

      // A day is complete when its page is saved. The next day then opens on the
      // following calendar day, unless the learner chose to open it early.
      const visible = (p) => Boolean(lessons[p.id]) && (PREVIEW || lessons[p.id].review?.status === "approved");
      const state = (p) => {
        if (!visible(p)) return "soon";
        if (store.pages?.[p.id]) return "done";
        if (PREVIEW || p.day === 1 || store.early?.[p.id]) return "open";
        const before = week.lessons.find((l) => l.day === p.day - 1);
        const savedAt = store.pages?.[before.id]?.savedAt;
        if (!savedAt) return "locked";
        return midnight(new Date()) > midnight(new Date(savedAt)) ? "open" : "waiting";
      };

      const reachable = week.lessons.filter((p) => ["open", "done"].includes(state(p)));
      const asked = week.lessons.find((p) => p.day === Number(params.get("day")));
      const planned = asked ?? reachable.find((p) => state(p) === "open") ?? reachable.at(-1) ?? week.lessons[0];
      const lesson = lessons[planned.id];
      const ctx = { week, lessons, store, visible, state };

      const nav = el("ol", { class: "days", "aria-label": "Days of the week" });
      const drawNav = () => nav.replaceChildren(...week.lessons.map((p) => {
        const s = state(p);
        const label = { soon: "coming soon", locked: "finish the day before first", waiting: "opens tomorrow", done: "complete", open: "open" }[s];
        const inner = [`${p.day}`, s === "done" ? " ✓" : null, el("span", { class: "sr" }, ` Day ${p.day}, ${label}`)];
        return el("li", {}, s === "soon" || s === "locked"
          ? el("span", { title: `Day ${p.day}: ${label}` }, inner)
          : el("a", { href: dayHref(p.day), class: s, title: `Day ${p.day}: ${s === "waiting" ? label : p.title}`, "aria-current": p.id === planned.id ? "page" : null }, inner));
      }));
      drawNav();

      const head = [
        nav,
        el("p", { class: "eyebrow" }, `${week.title.split(":")[0]} · Day ${planned.day} of ${week.lessons.length}`),
        el("h1", {}, planned.title),
        el("p", { class: "objective" }, `Today you will: ${planned.objective.charAt(0).toLowerCase()}${planned.objective.slice(1)}`),
      ];
      const current = state(planned);
      let body;
      if (current === "soon") {
        body = [el("div", { class: "banner" }, lesson
          ? "This lesson is being checked against its source and will open soon."
          : "This lesson is still being written.")];
      } else if (current === "locked") {
        const before = week.lessons.find((p) => p.day === planned.day - 1);
        body = [el("div", { class: "banner" },
          `Day ${planned.day} opens after you complete Day ${before.day}. `,
          el("a", { href: dayHref(before.day) }, `Go to Day ${before.day}`), ".")];
      } else if (current === "waiting") {
        const before = week.lessons.find((p) => p.day === planned.day - 1);
        const openNow = () => {
          store.early = { ...store.early, [planned.id]: true };
          saveStore(store);
          location.href = dayHref(planned.day);
        };
        body = [
          el("div", { class: "banner" }, `Day ${planned.day} opens tomorrow. One lesson a day gives each practice time to work.`),
          el("section", { class: "step" },
            el("div", { class: "step-num" }, "Until then"),
            el("p", { class: "practice" }, before.practice),
            el("div", { class: "actions" },
              el("button", { type: "button", onclick: openNow }, `Open Day ${planned.day} now`),
              el("span", { class: "note" }, "Skips the wait."))),
        ];
      } else {
        const builders = [
          lesson.retrieval || lesson.practice_followup ? yesterdayStep : null,
          listenStep, lesson.type === "scenario" ? scenarioStep : sortStep, journalStep, practiceStep,
        ].filter(Boolean);
        const complete = completeStep(lesson, ctx);
        ctx.onSaved = () => { drawNav(); complete.draw(); };
        body = [
          lesson.review?.status !== "approved" ? el("div", { class: "banner" }, "Draft preview. This lesson is not approved, so visitors cannot see it yet.") : null,
          ...builders.map((build, i) => build(i + 1, lesson, ctx)),
          complete.card,
          PREVIEW ? await reviewPanel(lesson, ctx) : null,
        ];
        // The draft banner reads better above the heading.
        if (body[0]) head.unshift(body.shift());
      }
      // replaceChildren would print a null as text, so drop empty slots first.
      app.replaceChildren(...[...head, ...body].filter(Boolean));
      document.title = `${planned.title} · Notes to Myself`;
      document.getElementById("foot").append(
        el("p", {}, "Each explanation is drafted with AI, checked line by line against the passage it explains, and approved by a person before it appears here. The source text is always one click away."),
        el("p", {}, "A project by ", el("a", { href: "https://terencegovender.com/" }, "Terence Govender"), ". ",
          el("a", { href: "https://terencegovender.com/philosophy" }, "About this project"), "."));
    } catch (err) {
      app.replaceChildren(el("p", { class: "banner" }, "The lesson could not be loaded. Please try again shortly."));
      console.error(err);
    }
  </script>
</body>
</html>
