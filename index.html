<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes to Myself</title>
  <meta name="description" content="One idea. Two minutes. A little wiser. Short philosophy lessons grounded in primary texts, with a journal you write yourself.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap">
  <style>
    :root {
      --paper: #f7f3ea; --card: #fffdf8; --ink: #23201b; --muted: #6b6459;
      --rule: #ddd5c5; --accent: #7a2e2e; --within: #2a6b5e; --beyond: #4d5876;
      --within-bg: #e3f0ec; --beyond-bg: #e6e9f1; --focus: #1d5fbf;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #191715; --card: #211e1b; --ink: #ece6da; --muted: #a59c8d;
        --rule: #3a352f; --accent: #e0a193; --within: #7fc9b8; --beyond: #a9b4d6;
        --within-bg: #1d302c; --beyond-bg: #232838; --focus: #8ab4ff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font: 400 1.0625rem/1.65 Roboto, system-ui, sans-serif;
    }
    main, header.site, footer.site { max-width: 42rem; margin: 0 auto; padding: 0 1rem; }
    header.site { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-top: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--rule); }
    .brand { font: 700 1.25rem "Playfair Display", Georgia, serif; }
    .tagline { color: var(--muted); font-size: .875rem; }
    a { color: var(--accent); }
    h1, h2 { font-family: "Playfair Display", Georgia, serif; line-height: 1.2; }
    h1 { font-size: clamp(2rem, 7vw, 2.75rem); margin: .25rem 0 .5rem; }
    h2 { font-size: 1.375rem; margin: 0 0 .75rem; }
    .eyebrow { color: var(--accent); font-size: .8125rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; margin-top: 2rem; }
    .objective { color: var(--muted); margin: 0 0 1.5rem; }
    section.step { background: var(--card); border: 1px solid var(--rule); border-radius: .75rem; padding: 1.25rem; margin: 1.25rem 0; }
    .step-num { color: var(--muted); font-size: .8125rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .25rem; }
    .transcript p { margin: 0 0 1rem; }
    button {
      font: inherit; font-weight: 500; cursor: pointer; border-radius: .5rem;
      border: 1px solid var(--ink); background: transparent; color: var(--ink);
      padding: .55rem .9rem; min-height: 2.75rem;
    }
    button.primary { background: var(--ink); color: var(--paper); }
    button:disabled { cursor: default; opacity: .55; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .listen { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-bottom: 1.25rem; }
    .listen small, .hint, .note { color: var(--muted); font-size: .875rem; }
    audio { width: 100%; }
    details { border-top: 1px solid var(--rule); margin-top: 1rem; padding-top: .75rem; }
    summary { cursor: pointer; font-weight: 500; }
    blockquote { margin: .75rem 0; padding-left: 1rem; border-left: 3px solid var(--rule); font-family: Georgia, serif; }
    .scenario { font-family: Georgia, serif; font-size: 1.125rem; margin: 0 0 .75rem; }
    .item { border-top: 1px solid var(--rule); padding: .9rem 0; }
    .item p { margin: 0 0 .6rem; }
    .choices { display: flex; flex-wrap: wrap; gap: .5rem; }
    .choices button { flex: 1 1 10rem; }
    .choices button[data-list="within"] { border-color: var(--within); color: var(--within); }
    .choices button[data-list="beyond"] { border-color: var(--beyond); color: var(--beyond); }
    .choices button[aria-pressed="true"][data-list="within"] { background: var(--within-bg); opacity: 1; }
    .choices button[aria-pressed="true"][data-list="beyond"] { background: var(--beyond-bg); opacity: 1; }
    .feedback { margin: .6rem 0 0 !important; font-size: .9375rem; }
    .feedback strong { display: block; }
    .summary { border-top: 1px solid var(--rule); padding-top: .9rem; }
    .summary ul { margin: .25rem 0 .75rem; padding-left: 1.25rem; }
    label { display: block; font-weight: 500; margin-top: 1rem; }
    label.within { color: var(--within); } label.beyond { color: var(--beyond); }
    textarea {
      width: 100%; min-height: 5.5rem; margin-top: .35rem; padding: .65rem; resize: vertical;
      font: inherit; color: var(--ink); background: var(--paper);
      border: 1px solid var(--rule); border-radius: .5rem;
    }
    .two-lists { display: grid; gap: 0 1rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin-top: 1rem; }
    .practice { font-family: Georgia, serif; font-size: 1.1875rem; margin: 0 0 1rem; }
    .banner { background: var(--beyond-bg); border: 1px solid var(--rule); border-radius: .5rem; padding: .75rem 1rem; margin-top: 1.25rem; font-size: .9375rem; }
    .review li { margin-bottom: .6rem; }
    .review code { font-size: .8125rem; }
    .bad { color: var(--accent); font-weight: 500; }
    footer.site { color: var(--muted); font-size: .875rem; padding-top: 1rem; padding-bottom: 3rem; }
  </style>
</head>
<body>
  <header class="site">
    <span class="brand">Notes to Myself</span>
    <span class="tagline">One idea. Two minutes. A little wiser.</span>
  </header>
  <main id="app" aria-live="polite"><p class="note" style="margin-top:2rem">Loading today's lesson…</p></main>
  <footer class="site" id="foot"></footer>

  <script type="module">
    const LESSON_ID = "w01-d1";
    const PREVIEW = new URLSearchParams(location.search).has("preview");
    const STORE_KEY = "notes-to-myself.v1";

    // ---- small helpers ----
    const el = (tag, attrs = {}, ...kids) => {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") node.className = v;
        else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
        else if (v !== null && v !== undefined) node.setAttribute(k, v);
      }
      for (const kid of kids.flat()) if (kid != null) node.append(kid);
      return node;
    };
    const paras = (text) => text.split(/\n\n+/).map((p) => el("p", {}, p));
    const loadStore = () => {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
    };
    const saveStore = (s) => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); return true; } catch { return false; }
    };
    const getJSON = async (url) => {
      const res = await fetch(url, { cache: "no-cache" });
      if (!res.ok) throw new Error(`${url}: ${res.status}`);
      return res.json();
    };

    // ---- 1. listen and read ----
    function listenStep(lesson) {
      const controls = el("div", { class: "listen" });
      if (lesson.audio?.file) {
        controls.append(el("audio", { controls: "", preload: "none", src: lesson.audio.file }));
      } else if ("speechSynthesis" in window) {
        let speaking = false;
        const btn = el("button", { class: "primary", type: "button" }, "▶ Listen");
        const stop = () => { speechSynthesis.cancel(); speaking = false; btn.textContent = "▶ Listen"; };
        btn.addEventListener("click", () => {
          if (speaking) return stop();
          const u = new SpeechSynthesisUtterance(lesson.script.text);
          u.rate = 0.95;
          u.onend = u.onerror = () => { speaking = false; btn.textContent = "▶ Listen"; };
          speechSynthesis.cancel();
          speechSynthesis.speak(u);
          speaking = true;
          btn.textContent = "■ Stop";
        });
        window.addEventListener("pagehide", stop);
        controls.append(btn, el("small", {}, "Read aloud by your browser's voice. A recorded narration is on the way."));
      }
      const s = lesson.source;
      const source = el("details", {},
        el("summary", {}, `Read the source: ${s.author}, ${s.work}, §${s.section}`),
        el("blockquote", {}, paras(s.passage)),
        el("p", { class: "note" }, `Translated by ${s.translator}. ${s.rights}. `,
          el("a", { href: s.source_url, rel: "noopener" }, "Project Gutenberg edition")));
      return el("section", { class: "step" },
        el("div", { class: "step-num" }, "1 · Listen"),
        controls,
        el("div", { class: "transcript" }, paras(lesson.script.text)),
        source);
    }

    // ---- 2. sort ----
    function sortStep(lesson, store) {
      const check = lesson.check;
      const answers = {};
      const wrap = el("section", { class: "step" },
        el("div", { class: "step-num" }, "2 · Sort"),
        el("p", { class: "scenario" }, check.scenario),
        el("p", {}, check.question));
      const summary = el("div", { class: "summary", hidden: "" });
      const items = check.items.map((item, i) => {
        const feedback = el("p", { class: "feedback", hidden: "", role: "status" });
        const buttons = Object.entries(check.lists).map(([key, label]) =>
          el("button", { type: "button", "data-list": key, "aria-pressed": "false", onclick: () => choose(key) }, label));
        function choose(key) {
          answers[i] = key;
          buttons.forEach((b) => { b.setAttribute("aria-pressed", String(b.dataset.list === key)); b.disabled = true; });
          const right = key === item.list;
          feedback.replaceChildren(el("strong", {}, right ? "Yes." : "Look again."), item.feedback);
          feedback.hidden = false;
          if (Object.keys(answers).length === check.items.length) finish();
        }
        const reset = () => {
          buttons.forEach((b) => { b.setAttribute("aria-pressed", "false"); b.disabled = false; });
          feedback.hidden = true;
        };
        const node = el("div", { class: "item" }, el("p", {}, item.text), el("div", { class: "choices" }, buttons), feedback);
        return { node, reset };
      });
      function finish() {
        const missed = check.items.filter((item, i) => answers[i] !== item.list);
        const tags = [...new Set(missed.map((m) => m.misconception))];
        store.checks = { ...store.checks, [lesson.id]: { at: new Date().toISOString(), misconceptions: tags } };
        saveStore(store);
        summary.replaceChildren(
          missed.length === 0
            ? el("p", {}, "All six match Epictetus's lists.")
            : el("div", {},
                el("p", {}, `${check.items.length - missed.length} of ${check.items.length} match Epictetus's lists. Worth another look:`),
                el("ul", {}, tags.map((t) => el("li", {}, check.misconception_notes?.[t] ?? t)))),
          el("button", { type: "button", onclick: again }, "Sort again"));
        summary.hidden = false;
      }
      function again() {
        for (const k of Object.keys(answers)) delete answers[k];
        items.forEach((it) => it.reset());
        summary.hidden = true;
      }
      wrap.append(...items.map((it) => it.node), summary);
      return wrap;
    }

    // ---- 3. the learner's own page ----
    function pageText(lesson, week, values) {
      const s = lesson.source;
      const lines = [
        "NOTES TO MYSELF", "",
        `${week.title}`, `Day ${lesson.day}: ${lesson.title}`,
        `${s.author}, ${s.work}, section ${s.section} (tr. ${s.translator})`,
        new Date().toLocaleDateString(undefined, { dateStyle: "long" }), "",
      ];
      for (const f of lesson.reflection.fields) lines.push(f.label.toUpperCase(), values[f.id] || "(left blank)", "");
      lines.push("PRACTICE", lesson.practice.text, "");
      return lines.join("\r\n");
    }
    function journalStep(lesson, week, store) {
      const saved = store.pages?.[lesson.id]?.values ?? {};
      const inputs = {};
      const field = (f) => {
        const ta = el("textarea", { id: `f-${f.id}`, "aria-describedby": `h-${f.id}` });
        ta.value = saved[f.id] ?? "";
        inputs[f.id] = ta;
        return el("div", {},
          el("label", { for: `f-${f.id}`, class: f.id }, f.label), ta,
          el("div", { class: "hint", id: `h-${f.id}` }, f.hint ?? ""));
      };
      const [first, ...lists] = lesson.reflection.fields;
      const status = el("span", { class: "note", role: "status" },
        store.pages?.[lesson.id] ? "Your earlier page is loaded." : "");
      const values = () => Object.fromEntries(Object.entries(inputs).map(([k, ta]) => [k, ta.value.trim()]));
      const save = () => {
        store.startedAt ??= new Date().toISOString();
        store.pages = { ...store.pages, [lesson.id]: { savedAt: new Date().toISOString(), values: values() } };
        status.textContent = saveStore(store)
          ? "Saved in this browser. Download a copy to keep it."
          : "This browser won't store pages. Download a copy instead.";
      };
      const download = () => {
        const blob = new Blob([pageText(lesson, week, values())], { type: "text/plain;charset=utf-8" });
        const a = el("a", { href: URL.createObjectURL(blob), download: `notes-to-myself-day-${lesson.day}.txt` });
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      };
      return el("section", { class: "step" },
        el("div", { class: "step-num" }, "3 · Your page"),
        el("h2", {}, lesson.reflection.prompt),
        field(first),
        el("div", { class: "two-lists" }, lists.map(field)),
        el("div", { class: "actions" },
          el("button", { class: "primary", type: "button", onclick: save }, "Save my page"),
          el("button", { type: "button", onclick: download }, "Download"),
          status),
        el("p", { class: "note" }, "Your page stays on this device. Nothing you write is sent anywhere."));
    }

    // ---- 4. practice ----
    function practiceStep(lesson) {
      return el("section", { class: "step" },
        el("div", { class: "step-num" }, "4 · Carry it with you"),
        el("p", { class: "practice" }, lesson.practice.text),
        lesson.next_teaser ? el("p", { class: "note" }, `Tomorrow: ${lesson.next_teaser}`) : null);
    }

    // ---- reviewer view (?preview) ----
    async function reviewPanel(lesson, week) {
      const panel = el("section", { class: "step review" }, el("div", { class: "step-num" }, "Reviewer view"));
      try {
        const { validateLesson, countWords } = await import("./tools/validate.mjs");
        const { errors, warnings } = validateLesson(lesson, week);
        panel.append(
          el("p", {}, `Status: ${lesson.review.status}. Script: ${countWords(lesson.script.text)} words. `,
            errors.length ? el("span", { class: "bad" }, `${errors.length} error(s).`) : "No validator errors."),
          el("ul", {}, errors.map((e) => el("li", { class: "bad" }, e)), warnings.map((w) => el("li", {}, `Warning: ${w}`))));
      } catch (err) {
        panel.append(el("p", { class: "bad" }, `Validator could not load: ${err.message}`));
      }
      panel.append(
        el("h2", {}, "Claims and their supporting words"),
        el("ul", {}, lesson.claims.map((c) => el("li", {}, c.claim, el("blockquote", {}, c.support_span), c.note ? el("div", { class: "note" }, c.note) : null))),
        el("h2", {}, "Claims from outside the passage"),
        el("ul", {}, lesson.outside_source_claims.map((c) => el("li", {}, c.claim, " ", el("code", {}, c.status), el("div", { class: "note" }, c.note)))));
      return panel;
    }

    // ---- boot ----
    const app = document.getElementById("app");
    try {
      const lesson = await getJSON(`content/lessons/${LESSON_ID}.json`);
      const week = await getJSON(`content/weeks/${lesson.week_id}.json`);
      const approved = lesson.review?.status === "approved";
      const store = loadStore();
      const head = [
        el("p", { class: "eyebrow" }, `${week.title.split(":")[0]} · Day ${lesson.day} of ${week.lessons.length}`),
        el("h1", {}, lesson.title),
        el("p", { class: "objective" }, `Today you will: ${lesson.objective.charAt(0).toLowerCase()}${lesson.objective.slice(1)}`),
      ];
      if (!approved && !PREVIEW) {
        app.replaceChildren(...head, el("div", { class: "banner" }, "This lesson is being checked against its source and will open soon."));
      } else {
        app.replaceChildren(
          !approved ? el("div", { class: "banner" }, "Draft preview. This lesson is not approved, so visitors cannot see it yet.") : null,
          ...head, listenStep(lesson), sortStep(lesson, store), journalStep(lesson, week, store), practiceStep(lesson),
          PREVIEW ? await reviewPanel(lesson, week) : null);
      }
      document.title = `${lesson.title} · Notes to Myself`;
      document.getElementById("foot").append(
        el("p", {}, "Each explanation is drafted with AI, checked line by line against the passage it explains, and approved by a person before it appears here. The source text is always one click away."),
        el("p", {}, "A project by ", el("a", { href: "https://terencegovender.com/" }, "Terence Govender"), ". ",
          el("a", { href: "https://terencegovender.com/philosophy" }, "About this project"), "."));
    } catch (err) {
      app.replaceChildren(el("p", { class: "banner" }, "The lesson could not be loaded. Please try again shortly."));
      console.error(err);
    }
  </script>
</body>
</html>
